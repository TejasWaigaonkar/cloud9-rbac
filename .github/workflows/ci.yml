name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cloud9
          POSTGRES_USER: cloud9
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cloud9 -d cloud9"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: cloud9
      POSTGRES_USER: cloud9
      POSTGRES_PASSWORD: ci-ephemeral-only
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest
      - run: python manage.py spectacular --file docs/openapi.yml --validate --fail-on-warn
      - run: docker build -t cloud9-rbac:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            coverage.xml
            docs/openapi.yml
