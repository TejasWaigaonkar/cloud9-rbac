name: Deploy complete application

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.workflow_runs | length')
          test "$count" -gt 0

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

      - name: Wait for deployment
        run: sleep 120

      - name: Verify production health
        run: |
          for i in {1..10}; do
            if curl --fail --silent --show-error \
              https://cloud9-rbac.onrender.com/health/; then
              echo "Production health check passed."
              exit 0
            fi

            echo "Waiting for Render deployment..."
            sleep 30
          done

          echo "Production health check failed."
          exit 1